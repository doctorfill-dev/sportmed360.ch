name: Deploy to Cloudflare Workers

# DÉSACTIVÉ — Le CI est géré directement par le dashboard Cloudflare
# (Option A choisie — voir issue #44)
# Ce workflow est conservé en référence mais ne se déclenche plus.
on:
  workflow_dispatch: # manuel uniquement

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site (Eleventy + Vite)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
